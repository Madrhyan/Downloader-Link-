name: 06 - ⚡ Advanced Direct Link Downloader (Queue Mode)

on:
  workflow_dispatch:
    inputs:
      download_urls:
        description: '🔗 لینک‌های مستقیم فایل‌ها - چند لینک را با فاصله از هم جدا کنید'
        required: true
        type: string

jobs:
  queue-download:
    name: "⚡ Processing Download Queue"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Show Welcome Notice
        run: |
          echo "========================================"
          echo "⚡ ADM-STYLE DIRECT LINK DOWNLOADER"
          echo "========================================"
          echo "📥 Queue System: Enabled (One by One)"
          echo "🚀 Engine: yt-dlp + Auto Extension Fixer"
          echo "========================================"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global http.postBuffer 524288000
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Start WARP Container
        run: |
          echo "Starting Cloudflare WARP for bypass..."
          docker network create warp-net || true
          docker run -d \
            --name warp \
            --restart=always \
            --network warp-net \
            -p 1080:1080 \
            --cap-add NET_ADMIN \
            -v warp-data:/var/lib/cloudflare-warp \
            caomingjun/warp
          sleep 15

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip curl jq file
          pip3 install --upgrade yt-dlp

      - name: Execute Sequential Download Queue
        env:
          URLS_INPUT: ${{ github.event.inputs.download_urls }}
        run: |
          mkdir -p downloaded_files
          
          read -ra URL_ARRAY <<< "$URLS_INPUT"
          TOTAL_FILES=${#URL_ARRAY[@]}
          
          echo "📋 Total files in queue: $TOTAL_FILES"
          echo "----------------------------------------"

          CURRENT_INDEX=0
          for URL in "${URL_ARRAY[@]}"; do
            CURRENT_INDEX=$((CURRENT_INDEX + 1))
            
            echo ""
            echo "========================================"
            echo "🔄 Processing File [$CURRENT_INDEX / $TOTAL_FILES]"
            echo "🔗 URL: $URL"
            echo "========================================"
            
            # استخراج پسوند احتمالی از انتهای لینک برای زاپاس
            CLEAN_URL=$(echo "$URL" | cut -d? -f1)
            EXT="${CLEAN_URL##*.}"
            # اگر پسوند خیلی طولانی یا عجیب بود، موقتاً خالی بماند
            if [ ${#EXT} -gt 5 ]; then EXT="download"; fi

            # دانلود با تنظیمات حفظ فرمت اصلی و استفاده از نام پیش‌فرض سرور
            yt-dlp --proxy "socks5://127.0.0.1:1080" \
                   --no-cache-dir \
                   --output "downloaded_files/%(title)s.%(ext)s" \
                   --no-playlist \
                   --retries 5 \
                   --restrict-filenames \
                   "$URL" || echo "❌ Failed to download File [$CURRENT_INDEX]"
            
            # --- بخش هوشمند تصحیح فرمت و نام ---
            cd downloaded_files
            # پیدا کردن آخرین فایل تغییر یافته یا بدون پسوند و تصحیح آن
            for f in *; do
              if [ -f "$f" ]; then
                # اگر اسم فایل unknown بود یا پسوند درستی نداشت
                if [[ "$f" == "unknown"* ]] || [[ "$f" != *.* ]]; then
                  # استفاده از ابزار سیستم‌عامل برای تشخیص ماهیت واقعی فایل (apk, zip, mp4 و ...)
                  MIME_TYPE=$(file --mime-type -b "$f")
                  REAL_EXT=""
                  case "$MIME_TYPE" in
                    "application/vnd.android.package-archive") REAL_EXT="apk" ;;
                    "application/zip") REAL_EXT="zip" ;;
                    "video/mp4") REAL_EXT="mp4" ;;
                    "audio/mpeg") REAL_EXT="mp3" ;;
                    "image/jpeg") REAL_EXT="jpg" ;;
                    "image/png") REAL_EXT="png" ;;
                    *) REAL_EXT="$EXT" ;; # اگر نشناخت، از پسوند لینک استفاده کند
                  esac
                  
                  NEW_NAME="file_${CURRENT_INDEX}_$(date +%s).${REAL_EXT}"
                  mv "$f" "$NEW_NAME"
                  echo "🔧 Fixed Extension: Renamed '$f' to '$NEW_NAME' (Type: $MIME_TYPE)"
                fi
              fi
            done
            cd ..
            echo "----------------------------------------"
          done

      - name: Stop WARP Container
        if: always()
        run: |
          docker stop warp || true
          docker rm warp || true

      - name: Commit and Push to Repository
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          
          git config set advice.addIgnoredFile false || true
          git add downloaded_files/ 2>/dev/null || git add -f downloaded_files/

          if ! git diff --cached --quiet; then
            git commit -m "[SYSTEM] Direct queue downloads completed [skip ci]"
            
            PUSH_RETRY=0
            while [ $PUSH_RETRY -lt 5 ]; do
              PUSH_RETRY=$((PUSH_RETRY + 1))
              if timeout 60 git push origin HEAD:"$BRANCH"; then
                echo "========================================"
                echo "✅ فایل‌ها با فرمت اصلاح‌شده ذخیره شدند!"
                echo "========================================"
                break
              else
                echo "Push failed, retry $PUSH_RETRY/5..."
                sleep 5
                git fetch origin "$BRANCH"
                git reset --hard origin/"$BRANCH"
                git add downloaded_files/ 2>/dev/null || git add -f downloaded_files/
                git diff --cached --quiet || git commit -m "[SYSTEM] Direct queue downloads completed [skip ci]"
              fi
            done
          else
            echo "ℹ️ No new files added to the repository."
          fi
