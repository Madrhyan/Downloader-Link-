name: Download File via Cloudflare WARP

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: 'Direct Link to Download'
        required: true
        default: 'https://example.com/file.zip'

jobs:
  download_job:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install and Configure Cloudflare WARP
      run: |
        # 1. اضافه کردن ریپازیتوری کلاودفلر
        curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
        echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
        
        # 2. نصب کلاینت WARP
        sudo apt-get update && sudo apt-get install cloudflare-warp -y
        
        # 3. ثبت‌نام و اتصال به شبکه WARP
        warp-cli --accept-tos registration new
        warp-cli --accept-tos mode warp
        warp-cli --accept-tos connect
        
        # 4. تست اتصال
        sleep 5
        curl -s https://www.cloudflare.com/cdn-cgi/trace

    - name: Create Downloads Directory & Download File
      run: |
        # ایجاد پوشه جدید در ریشه ریپازیتوری
        mkdir -p downloads
        
        echo "Starting download from: ${{ github.event.inputs.file_url }}"
        
        # استخراج نام فایل از انتهای لینک (گزینه اختیاری برای حفظ نام واقعی فایل)
        FILE_NAME=$(basename "${{ github.event.inputs.file_url }}")
        
        # دانلود فایل و ذخیره مستقیم در پوشه downloads
        curl -L "${{ github.event.inputs.file_url }}" -o "downloads/$FILE_NAME"
        
        echo "Download completed!"
        ls -lh downloads/

    - name: Upload Folder as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: all-downloaded-files
        # اینجا کل پوشه downloads را به عنوان آرتیفکت آپلود می‌کنیم
        path: downloads/
